<!-- Navbar -->
<nav class="main-header navbar navbar-expand navbar-white navbar-light">
  <!-- Left navbar links -->
  <ul class="navbar-nav">
    <li class="nav-item">
      <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
    </li>
    <li class="nav-item d-none d-sm-inline-block">
      <a href="{% url 'dashboard' %}" class="nav-link">Home</a>
    </li>
  </ul>

  <!-- Right navbar links -->
  <ul class="navbar-nav ms-auto">
    <li class="nav-item">
      <a class="nav-link" href="#" id="wis-page-guide" role="button" title="Page Guide" data-bs-toggle="tooltip" data-bs-placement="bottom">
        <i class="fas fa-question-circle"></i> <span class="d-none d-md-inline">Guide</span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="#" id="wis-tour-replay" role="button" title="Replay Full Tour" data-bs-toggle="tooltip" data-bs-placement="bottom">
        <i class="fas fa-route"></i> <span class="d-none d-md-inline">Tour</span>
      </a>
    </li>
    <li class="nav-item dropdown">
      <a class="nav-link" data-bs-toggle="dropdown" href="#" role="button" aria-expanded="false">
        <i class="fas fa-user-circle"></i> {{ request.user.get_full_name|default:request.user.username }}
      </a>
      <div class="dropdown-menu dropdown-menu-end">
        <span class="dropdown-item-text text-muted">
          <small>{{ request.user.email|default:request.user.username }}</small>
        </span>
        <div class="dropdown-divider"></div>
        <a href="#" class="dropdown-item" id="navbar-logout-btn">
          <i class="fas fa-sign-out-alt me-2"></i> Logout
        </a>
      </div>
    </li>
    <li class="nav-item">
      <a class="nav-link" data-widget="fullscreen" href="#" role="button">
        <i class="fas fa-expand-arrows-alt"></i>
      </a>
    </li>
  </ul>
</nav>
<!-- Hidden logout form placed outside the navbar to avoid nesting inside page forms -->
<form method="post" action="{% url 'logout' %}" id="navbar-logout-form" style="display:none;">
  {% csrf_token %}
</form>
<script>
document.getElementById('navbar-logout-btn').addEventListener('click', function(e) {
  e.preventDefault();
  document.getElementById('navbar-logout-form').submit();
});
</script>
<!-- /.navbar -->
