{% load custom_filters %}
{% with current_pp=request.GET.per_page|default:"25" %}
<div class="wis-toolbar d-flex flex-wrap align-items-center justify-content-between" data-wis-toolbar>
  <div class="d-flex align-items-center gap-2 wis-toolbar-entries">
    <span class="small text-muted text-nowrap">Show</span>
    <select class="form-select form-select-sm no-select2" style="width:auto;" data-toolbar-param="per_page" title="Entries per page">
      <option value="10" {% if current_pp == "10" %}selected{% endif %}>10</option>
      <option value="25" {% if current_pp == "25" %}selected{% endif %}>25</option>
      <option value="50" {% if current_pp == "50" %}selected{% endif %}>50</option>
      <option value="100" {% if current_pp == "100" %}selected{% endif %}>100</option>
      <option value="all" {% if current_pp == "all" %}selected{% endif %}>All</option>
    </select>
    <span class="small text-muted text-nowrap">entries</span>
  </div>

  <div class="d-flex flex-wrap align-items-center gap-2 wis-toolbar-actions">
    {% for f in filters %}
    <select class="form-select form-select-sm no-select2 wis-toolbar-filter" data-toolbar-param="{{ f.param }}" title="{{ f.label }}">
      <option value="">{{ f.label }}: All</option>
      {% with current_val=request.GET|get_item:f.param %}
      {% for val, label in f.options %}
      <option value="{{ val }}" {% if current_val == val|stringformat:"s" %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
      {% endwith %}
    </select>
    {% endfor %}

    <div class="input-group input-group-sm wis-toolbar-search">
      <span class="input-group-text bg-white"><i class="fas fa-search text-muted" style="font-size:.75rem;"></i></span>
      <input type="text" class="form-control" data-toolbar-param="q"
             placeholder="{{ search_placeholder|default:'Search…' }}"
             value="{{ request.GET.q }}" autocomplete="off">
      {% if request.GET.q %}
      <button class="btn btn-sm btn-outline-secondary" type="button" data-toolbar-clear="q" title="Clear search">
        <i class="fas fa-times"></i>
      </button>
      {% endif %}
    </div>
  </div>
</div>
{% endwith %}
