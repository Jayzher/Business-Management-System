name: business_management_app
description: Business Management System - Mobile App with offline sync
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Database (Offline-first)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Networking
  dio: ^5.5.0+1
  connectivity_plus: ^6.0.3

  # Auth / Secure Storage
  flutter_secure_storage: ^9.2.2

  # UI
  flutter_adaptive_scaffold: ^0.1.11
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Barcode / QR
  mobile_scanner: ^5.1.1

  # Utilities
  uuid: ^4.4.2
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.2
  logger: ^2.3.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
